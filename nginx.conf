# Domínio de loja -> HTML de entrada da loja (título, ícone e prévia de link próprios; gerado por
# scripts/brand-pages.mjs). O app, nesse domínio, só mostra as páginas públicas da loja (App.tsx).
map $host $spa_index {
    default                   /index.html;
    ~*(^|\.)lojaoutback\.com\.br$  /outback.html;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers (arquivo repetido em cada location: ver comentário no próprio arquivo)
    include /etc/nginx/snippets/security-headers.conf;

    # Cache de assets estáticos (nomes com hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Raiz: HTML do domínio (SpyPro ou loja)
    location = / {
        try_files $spa_index =404;
    }

    # index.html nunca em cache: um deploy novo precisa ser visto na hora (os assets têm hash no nome)
    location ~ ^/(index|outback)\.html$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Páginas públicas pré-renderizadas no build (scripts/prerender.mjs): texto legível sem JavaScript
    location ~ ^/(privacidade|termos)/?$ {
        try_files /$1.html /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA — todas as rotas redirecionam para index.html
    location / {
        try_files $uri $uri/ $spa_index;
    }
}
