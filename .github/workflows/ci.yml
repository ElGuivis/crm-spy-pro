name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Token do workflow só com leitura (nenhum job precisa escrever no repositório)
permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Mesmo Node e mesmo gerenciador do Dockerfile (node:20 + npm ci)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # O tsconfig.json da raiz tem `files: []` (só referências): `tsc --noEmit` nele não checa nada.
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npm run build

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  env-secrets-check:
    name: Env Secrets Gate
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Block private secrets in .env
        run: deno run --allow-read scripts/check-env-secrets.ts

  file-size-check:
    name: File Size Gate
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check file sizes (blocks on critical violations)
        run: deno run --allow-read --allow-env scripts/check-file-sizes.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check broken relative imports in edge functions
        run: node scripts/check-missing-imports.cjs

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check schema drift
        run: deno run --allow-read scripts/check-schema-drift.ts

  function-contract-audit:
    name: Function Contract Audit
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Audit function contracts
        run: deno run --allow-read scripts/audit-function-contracts.ts

  edge-function-tests:
    name: Edge Function Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    # Estes testes chamam as edge functions já publicadas (projeto de produção) usando só a chave
    # publicável. Todos os valores abaixo são públicos (iguais ao .env.production e ao bundle do site);
    # não há secrets do GitHub aqui. O happy-path tenta criar um usuário de teste e, com o cadastro
    # bloqueado (trigger block_new_signups), pula sozinho sem criar nada.
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Load public environment
        run: |
          tr -d '\r' < .env.production >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PROJECT_ID=spypro-selfhosted" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=https://spypro.com.br" >> "$GITHUB_ENV"
          echo "ALLOW_PREVIEW_ORIGINS=false" >> "$GITHUB_ENV"

      - name: Auth, internal, webhook, CORS, invite, contract and flow tests
        run: deno test supabase/functions/tests/ --allow-net --allow-env --allow-read
