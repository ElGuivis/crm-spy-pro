# Headers de segurança. Incluído em cada `location` porque o nginx NÃO herda add_header
# do nível superior quando o location define algum add_header próprio.
#
# CSP: sem 'unsafe-eval' e sem 'unsafe-inline' em script-src (o bundle não usa eval nem scripts inline;
# os dois `Function("return this")` do bundle são fallbacks de lodash/core-js que nunca são alcançados no
# navegador). 'unsafe-inline' segue só em style-src (Radix/React gravam `style=` em elementos).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.spypro.com.br wss://api.spypro.com.br https://*.supabase.co wss://*.supabase.co https://evolution.spypro.com.br https://chatwoot.spypro.com.br https://webhook.spypro.com.br; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
